<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <meta
      name="description"
      content="Xplainer turns any topic into a narrated, illustrated 1080p explainer video — scripted by AI and rendered in your own browser."
    />
    <meta property="og:title" content="Xplainer — Turn any topic into a video that teaches" />
    <meta
      property="og:description"
      content="AI writes the script, records the narration and draws the figures. Your browser renders the MP4."
    />
    <meta property="og:type" content="website" />
    <title>Xplainer — Turn any topic into a video that teaches</title>
    <script>
      // Resolve the theme before first paint so the page never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('xplainer-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
